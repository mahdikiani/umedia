[project]
name = "umedia-api"
version = "0.1.0"
description = "Universal Media Manager API"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "alembic",
    "apscheduler",
    "cryptography",
    "email-validator",
    "fastapi",
    "fastapi-mongo-base",
    "greenlet",
    "pydantic-settings",
    "pyjwt",
    "sqlalchemy",
    "kurigram>=2.2.26",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "asgi-lifespan",
    "httpx2",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["apps", "server", "utils"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
