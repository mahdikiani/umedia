[pytest]
pythonpath = .
testpaths = tests

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

addopts = 
    --cov=apps
    --cov=server
    --cov=utils
    ; --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

filterwarnings =
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning
    ignore:.*'model_fields'.*:DeprecationWarning
    # ignore:.*event_loop.*:DeprecationWarning
