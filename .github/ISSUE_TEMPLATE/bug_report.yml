name: Bug report
description: Report a reproducible problem in UMedia.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, OAuth secrets, Telegram session strings, private URLs, or personal files. Redact logs before posting.
  - type: input
    id: version
    attributes:
      label: UMedia version or commit
      description: Include the image tag or Git commit you are running.
      placeholder: e.g. main at abc1234
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider involved
      options:
        - Local filesystem
        - S3-compatible storage
        - Google Drive
        - Microsoft OneDrive
        - Dropbox
        - Telegram
        - Other / not provider-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove credentials, tokens, session strings, private hostnames, and personal file names first.
    validations:
      required: false
