name: Release Docker images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish media image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/media/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/umedia-media:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/umedia-media:latest
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/umedia-web:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/umedia-web:latest
