name: Release Docker images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish media image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/media/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/umedia-media:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/umedia-media:latest
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/umedia-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/umedia-web:latest
