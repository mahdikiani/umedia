name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: media (pytest + S3 clients)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media/app
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install S3 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 rclone unzip
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          sudo curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc \
            -o /usr/local/bin/mc
          sudo chmod +x /usr/local/bin/mc
          command -v rclone
          command -v aws
          command -v mc

      - name: Install Python deps
        run: uv sync --group dev

      - name: Pytest (including boto3 / rclone / aws / mc)
        run: uv run pytest -q

  web:
    name: web (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
