name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: media (pytest + S3 clients)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media/app
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install S3 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 unzip
          # Same pinned rclone as apps/media/app/Dockerfile: apt ships
          # 1.60.1, which silently ignores sftp `host_keys` (no host-key
          # pinning) -- tests/test_plugin_rclone_servers.py catches that.
          curl -fsSL https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip \
            -o /tmp/rclone.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  /tmp/rclone.zip" \
            | sha256sum --check
          unzip -q -j /tmp/rclone.zip "*/rclone" -d /tmp/rclone-bin
          sudo install -m 0755 /tmp/rclone-bin/rclone /usr/local/bin/rclone
          rclone version | head -1
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          curl -fsSL https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z \
            -o /tmp/mc
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  /tmp/mc" \
            | sha256sum --check
          sudo install -m 0755 /tmp/mc /usr/local/bin/mc
          command -v rclone
          command -v aws
          command -v mc

      - name: Install Python deps
        run: uv sync --group dev

      - name: Pytest (including boto3 / rclone / aws / mc)
        run: uv run pytest -q

  web:
    name: web (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
